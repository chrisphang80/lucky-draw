<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手机控制端</title>
<style>
  body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; margin: 0; }
  .status { font-size: 16px; color: #f39c12; margin-bottom: 20px; }
  .control-btns { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
  .btn { width: 100%; height: 120px; border-radius: 20px; border: none; font-size: 36px; font-weight: bold; color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.1s; }
  .btn:active { transform: scale(0.95); }
  #startBtn { background: #2ecc71; display: none; }
  #stopBtn { background: #e74c3c; display: none; }
  
  #setupArea { display: none; text-align: left; }
  textarea { width: 100%; height: 150px; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: none; font-size: 16px; }
  input[type="number"], input[type="text"] { padding: 8px; font-size: 16px; border-radius: 5px; border: none; margin-bottom: 10px; width: 100%; }
  .setup-btn { width: 100%; padding: 18px; background: #3498db; color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; margin-top: 15px; }
  
  /* 输入房间号的区域 */
  #connectArea { padding: 30px 10px; }
  #roomInput { width: 200px; height: 60px; font-size: 32px; text-align: center; border-radius: 10px; border: 2px solid #3498db; margin: 20px 0; letter-spacing: 5px; }
  #connectBtn { width: 200px; height: 50px; font-size: 20px; background: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; }
</style>
</head>
<body>

<!-- 连接电脑区 -->
<div id="connectArea">
  <h2>连接电脑大屏</h2>
  <p style="color:#aaa; font-size:14px;">请输入电脑屏幕上显示的4位房间号</p>
  <input type="number" id="roomInput" placeholder="0000">
  <br>
  <button id="connectBtn">连接</button>
</div>

<div id="status" class="status" style="display:none;"></div>

<!-- 名单配置区 -->
<div id="setupArea">
  <h3>1. 设置奖项 (顺序: 小->中->大)</h3>
  <div>奖项1名称: <input type="text" value="🍬 小礼物" id="p1name"> 数量: <input type="number" value="54" id="p1count"></div>
  <div style="margin-top:10px;">奖项2名称: <input type="text" value="🎁 中号礼物" id="p2name"> 数量: <input type="number" value="60" id="p2count"></div>
  <div style="margin-top:10px;">奖项3名称: <input type="text" value="🏆 大礼包" id="p3name"> 数量: <input type="number" value="30" id="p3count"></div>
  
  <h3 style="margin-top:20px;">2. 每次抽取人数</h3>
  <input type="number" id="drawCountInput" value="1" min="1" style="width: 100px;">

  <h3 style="margin-top:20px;">3. 粘贴学生名单</h3>
  <textarea id="nameInput" placeholder="每行一个名字"></textarea>
  
  <button class="setup-btn" id="sendSetupBtn">发送名单到大屏幕</button>
</div>

<!-- 抽奖控制区 -->
<div class="control-btns" id="controlArea">
  <button class="btn" id="startBtn">开 始</button>
  <button class="btn" id="stopBtn">停 止</button>
</div>

<script>
let ws;
let isConnected = false;

document.getElementById('connectBtn').onclick = () => {
  const room = document.getElementById('roomInput').value.trim();
  if (!room) { alert('请输入房间号！'); return; }
  
  document.getElementById('connectBtn').innerText = "连接中...";
  
  // 连接服务器
  const wsUrl = `wss://0.peerjs.com/peerjs?key=peerjs&id=REMOTE${Date.now()}&token=1&dst=LX${room}`;
  
  try {
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      isConnected = true;
      document.getElementById('connectArea').style.display = 'none';
      document.getElementById('status').style.display = 'block';
      document.getElementById('status').innerText = "✅ 已连接大屏幕！请配置名单。";
      document.getElementById('setupArea').style.display = 'block';
    };

    ws.onmessage = (event) => {
      // 忽略收到的消息，手机端只发不收
    };

    ws.onerror = () => {
      document.getElementById('connectBtn').innerText = "连接";
      alert("连接失败，请检查房间号是否正确。");
    };
  } catch(e) {
    document.getElementById('connectBtn').innerText = "连接";
    alert("网络错误。");
  }
};

// 发送指令的通用函数
function sendData(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'DATA', payload: data }));
  } else {
    alert('电脑未连接，请刷新重试！');
  }
}

document.getElementById('sendSetupBtn').onclick = () => {
  const names = document.getElementById('nameInput').value.split('\n').map(l => l.trim()).filter(l => l);
  if (names.length === 0) { alert('请输入名单'); return; }
  
  const prizes = [
    { name: document.getElementById('p1name').value, count: parseInt(document.getElementById('p1count').value) || 0 },
    { name: document.getElementById('p2name').value, count: parseInt(document.getElementById('p2count').value) || 0 },
    { name: document.getElementById('p3name').value, count: parseInt(document.getElementById('p3count').value) || 0 }
  ];
  const drawCount = parseInt(document.getElementById('drawCountInput').value) || 1;

  sendData({ action: 'setup', names: names, prizes: prizes, drawCount: drawCount });

  document.getElementById('setupArea').style.display = 'none';
  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('status').innerText = "准备就绪，点击开始抽奖！";
};

document.getElementById('startBtn').onclick = () => {
  sendData({ action: 'start' });
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
};

document.getElementById('stopBtn').onclick = () => {
  sendData({ action: 'stop' });
  document.getElementById('stopBtn').style.display = 'none';
  setTimeout(() => {
    document.getElementById('startBtn').style.display = 'block';
  }, 5000); 
};
</script>
</body>
</html>
