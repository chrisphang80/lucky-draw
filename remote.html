<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手机控制端</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
  .status { font-size: 18px; color: #f39c12; margin-bottom: 20px; }
  .control-btns { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
  .btn { width: 100%; height: 100px; border-radius: 15px; border: none; font-size: 32px; font-weight: bold; color: #fff; }
  #startBtn { background: #2ecc71; display: none; }
  #stopBtn { background: #e74c3c; display: none; }
  
  /* 配置区 */
  #setupArea { display: none; text-align: left; }
  textarea { width: 100%; height: 200px; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
  input[type="number"] { width: 60px; padding: 5px; font-size: 16px; }
  .setup-btn { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 18px; margin-top: 10px; }
</style>
</head>
<body>

<div id="status" class="status">正在连接电脑大屏...</div>

<!-- 名单配置区 -->
<div id="setupArea">
  <h3>1. 设置奖项 (顺序: 小->中->大)</h3>
  <div id="prizeInputs">
    <div>奖1名称: <input type="text" value="🍬 小礼物" id="p1name"> 数量: <input type="number" value="54" id="p1count"></div>
    <div style="margin-top:10px;">奖2名称: <input type="text" value="🎁 中号礼物" id="p2name"> 数量: <input type="number" value="60" id="p2count"></div>
    <div style="margin-top:10px;">奖3名称: <input type="text" value="🏆 大礼包" id="p3name"> 数量: <input type="number" value="30" id="p3count"></div>
  </div>
  
  <h3 style="margin-top:20px;">2. 每次抽取人数</h3>
  <input type="number" id="drawCountInput" value="1" min="1" style="width: 80px; padding: 10px;">

  <h3 style="margin-top:20px;">3. 粘贴学生名单</h3>
  <textarea id="nameInput" placeholder="每行一个名字，前面对应小礼物，后面对应大礼包..."></textarea>
  
  <button class="setup-btn" id="sendSetupBtn">发送名单到大屏幕</button>
</div>

<!-- 抽奖控制区 -->
<div class="control-btns" id="controlArea">
  <button class="btn" id="startBtn">开 始</button>
  <button class="btn" id="stopBtn">停 止</button>
</div>

<script>
// 获取 URL 中的房间号
const urlParams = new URLSearchParams(window.location.search);
const roomId = urlParams.get('room');

if (!roomId) {
  document.getElementById('status').innerText = "错误：请扫描电脑上的二维码打开此页面！";
} else {
  // 连接电脑端
  const peer = new Peer(); // 手机端自动分配 ID
  
  peer.on('open', () => {
    const conn = peer.connect(roomId);
    
    conn.on('open', () => {
      document.getElementById('status').innerText = "✅ 已连接大屏幕！请在下方配置名单。";
      document.getElementById('status').style.color = "#2ecc71";
      document.getElementById('setupArea').style.display = 'block';
    });

    // 接收电脑端的指令
    conn.on('data', (data) => {
      if (data.action === 'readyForSetup') {
        // 电脑端准备好了，但手机端已经在界面上可以点了，不需要额外处理
      }
    });

    // 发送名单给电脑
    document.getElementById('sendSetupBtn').onclick = () => {
      const names = document.getElementById('nameInput').value.split('\n').map(l => l.trim()).filter(l => l);
      if (names.length === 0) { alert('请输入名单'); return; }
      
      const prizes = [
        { name: document.getElementById('p1name').value, count: parseInt(document.getElementById('p1count').value) || 0 },
        { name: document.getElementById('p2name').value, count: parseInt(document.getElementById('p2count').value) || 0 },
        { name: document.getElementById('p3name').value, count: parseInt(document.getElementById('p3count').value) || 0 }
      ];
      const drawCount = parseInt(document.getElementById('drawCountInput').value) || 1;

      // 发送给电脑
      conn.send({ action: 'setup', names: names, prizes: prizes, drawCount: drawCount });

      // 切换 UI 到抽奖状态
      document.getElementById('setupArea').style.display = 'none';
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('status').innerText = "准备就绪，点击开始抽奖！";
    };

    // 控制按钮
    document.getElementById('startBtn').onclick = () => {
      conn.send({ action: 'start' });
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
    };

    document.getElementById('stopBtn').onclick = () => {
      conn.send({ action: 'stop' });
      document.getElementById('stopBtn').style.display = 'none';
      setTimeout(() => {
        document.getElementById('startBtn').style.display = 'block';
      }, 4000); // 4秒后恢复开始按钮（留出看结果的时间）
    };
  });
}
</script>
</body>
</html>
