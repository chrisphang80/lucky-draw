<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机控制端</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
  .status { font-size: 18px; color: #f39c12; margin-bottom: 20px; }
  .btn { width: 100%; height: 100px; border-radius: 15px; border: none; font-size: 32px; font-weight: bold; color: #fff; margin-top: 20px; }
  #startBtn { background: #2ecc71; display: none; }
  #stopBtn { background: #e74c3c; display: none; }
  #setupArea { display: none; text-align: left; }
  textarea { width: 100%; height: 200px; padding: 10px; border-radius: 8px; }
  .setup-btn { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 18px; }
</style>
</head>
<body>
<div id="status" class="status">正在加载...</div>

<div id="setupArea">
  <h3>粘贴学生名单</h3>
  <textarea id="nameInput" placeholder="每行一个名字"></textarea>
  <button class="setup-btn" id="sendSetupBtn" style="margin-top:10px;">发送名单到大屏幕</button>
</div>

<button class="btn" id="startBtn">开 始</button>
<button class="btn" id="stopBtn">停 止</button>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const roomId = urlParams.get('room');

  if (!roomId) {
    document.getElementById('status').innerText = "请扫描电脑屏幕上的二维码！";
  } else if (typeof Peer === 'undefined') {
    document.getElementById('status').innerText = "插件加载失败，请刷新页面！";
  } else {
    const peer = new Peer();
    peer.on('open', () => {
      const conn = peer.connect(roomId);
      conn.on('open', () => {
        document.getElementById('status').innerText = "✅ 已连接大屏幕！";
        document.getElementById('status').style.color = "#2ecc71";
        document.getElementById('setupArea').style.display = 'block';
      });

      // 发送名单
      document.getElementById('sendSetupBtn').onclick = () => {
        const names = document.getElementById('nameInput').value.split('\n').map(l=>l.trim()).filter(l=>l);
        if(names.length === 0) { alert('请输入名字'); return; }
        conn.send({ action: 'setup', names: names });
        
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('startBtn').style.display = 'block';
      };

      // 点击开始
      document.getElementById('startBtn').onclick = () => {
        conn.send({ action: 'start' });
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
      };

      // 点击停止
      document.getElementById('stopBtn').onclick = () => {
        conn.send({ action: 'stop' });
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('startBtn').style.display = 'block';
      };
    });
  }
</script>
</body>
</html>
