<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>电脑大屏展示端</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%); color: #fff; font-family: 'Microsoft YaHei', sans-serif; overflow: hidden; height: 100vh; }
  #stars, #sphereContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #stars { z-index: 0; pointer-events: none; }
  #sphereContainer { z-index: 1; perspective: 1200px; overflow: hidden; }
  
  .name-tag { position: absolute; color: #fff; font-size: 16px; font-weight: bold; white-space: nowrap; will-change: transform, opacity; }
  .winner-tag { color: #ffd700 !important; text-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00 !important; z-index: 999; }
  
  #resultBoard {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85); border: 2px solid #ffd700; border-radius: 15px;
    padding: 40px 60px; text-align: center; z-index: 200; display: none;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.6); width: 85%; max-width: 900px;
  }
  #resultGift { font-size: 28px; color: #00d2ff; margin-bottom: 20px; font-weight: bold; }
  #winnerNamesContainer { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
  .winner-name { font-size: 48px; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px #ffd700; }

  /* 初始配置区 */
  #setupPanel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #1e293b; padding: 40px; border-radius: 15px; text-align: center;
    z-index: 500; width: 600px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
  }
  #roomCode { font-size: 48px; color: #ffd700; font-weight: bold; letter-spacing: 5px; margin: 20px 0; }
  #qrcode { background: #fff; padding: 10px; border-radius: 10px; display: inline-block; margin-bottom: 20px; }
  #connStatus { color: #2ecc71; font-weight: bold; margin-bottom: 20px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="sphereContainer"></div>

<div id="resultBoard">
  <div id="resultGift"></div>
  <div id="winnerNamesContainer"></div>
</div>

<div id="setupPanel">
  <h2>请用手机扫描下方二维码连接控制端</h2>
  <div id="roomCode">加载中...</div>
  <div id="qrcode"></div>
  <div id="connStatus">等待手机连接...</div>
  <button id="startConfigBtn" style="display:none; padding: 12px 30px; font-size:18px; background:#00d2ff; border:none; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer;">配置名单并开始</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// --- 数据与变量 ---
let KIDS = []; let remainingKIDS = []; let tags = []; let isSpinning = false; let animFrame;
let drawCount = 1; let currentRadius = 300;
let rotationX = 0, rotationY = 0, currentSpeedX = 0.002, currentSpeedY = 0.005, targetSpeedX = 0.002, targetSpeedY = 0.005;
let prizes = [];

// --- 初始化 PeerJS (信令服务器免费公共节点) ---
// 生成一个 4 位随机房间号
const roomId = 'LX' + Math.floor(1000 + Math.random() * 9000); 
document.getElementById('roomCode').innerText = roomId;

const peer = new Peer(roomId);

peer.on('open', (id) => {
  // 生成二维码 (连接地址带上房间号)
  const url = window.location.href.split('?')[0] + '?room=' + id;
  new QRCode(document.getElementById("qrcode"), { text: url, width: 150, height: 150 });
});

let conn;
peer.on('connection', (connection) => {
  conn = connection;
  document.getElementById('connStatus').innerText = "✅ 手机已连接！请配置名单。";
  document.getElementById('connStatus').style.color = "#2ecc71";
  document.getElementById('startConfigBtn').style.display = 'inline-block';

  // 接收手机传来的指令
  conn.on('data', (data) => {
    if (data.action === 'start') {
      document.getElementById('setupPanel').style.display = 'none'; // 隐藏配置面板
      startSpin();
    } else if (data.action === 'stop') {
      stopSpin();
    } else if (data.action === 'setup') {
      prizes = data.prizes;
      drawCount = data.drawCount;
      buildSphere(data.names);
    }
  });
});

// 配置按钮点击，告知手机端可以发送数据了（这里简化处理，直接提示手机操作，手机上会有专门的页面）
document.getElementById('startConfigBtn').onclick = () => {
  // 告诉手机，电脑准备好了
  conn.send({ action: 'readyForSetup' });
};

// --- 3D 渲染核心 (和之前一样) ---
function buildSphere(names) {
  KIDS = [];
  let nameIndex = 0;
  prizes.forEach((p, tierIndex) => {
    for (let i = 0; i < p.count; i++) {
      if (nameIndex >= names.length) break;
      KIDS.push({ name: names[nameIndex], prizeName: p.name, tierIndex: tierIndex });
      nameIndex++;
    }
  });
  while (nameIndex < names.length) {
    KIDS.push({ name: names[nameIndex], prizeName: prizes[prizes.length - 1].name, tierIndex: prizes.length - 1 });
    nameIndex++;
  }
  
  remainingKIDS = [...KIDS];
  const container = document.getElementById('sphereContainer');
  container.innerHTML = ''; tags = [];
  if (remainingKIDS.length === 0) return;

  currentRadius = Math.min(400, window.innerWidth / 4);
  const numTags = KIDS.length;
  const phi = Math.PI * (3 - Math.sqrt(5)); 

  KIDS.forEach((kid, i) => {
    const el = document.createElement('div');
    el.className = 'name-tag'; el.textContent = kid.name; container.appendChild(el);
    const y = 1 - (i / (numTags - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = phi * i;
    tags.push({ el: el, name: kid.name, prizeName: kid.prizeName, tierIndex: kid.tierIndex, x: Math.cos(theta) * radiusAtY * currentRadius, y: y * currentRadius, z: Math.sin(theta) * radiusAtY * currentRadius });
  });
  if(!animFrame) animateSphere();
}

function animateSphere() {
  currentSpeedX += (targetSpeedX - currentSpeedX) * 0.05;
  currentSpeedY += (targetSpeedY - currentSpeedY) * 0.05;
  rotationX += currentSpeedX; rotationY += currentSpeedY;
  const cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
  const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2, fov = 800;

  tags.forEach(tag => {
    let x1 = tag.x * cosY - tag.z * sinY, z1 = tag.z * cosY + tag.x * sinY;
    let y2 = tag.y * cosX - z1 * sinX, z2 = z1 * cosX + tag.y * sinX;
    let scale = fov / (fov + z2); if (scale < 0) scale = 0.1; 
    let screenX = cx + x1 * scale, screenY = cy + y2 * scale;
    let baseOpacity = tag.el.classList.contains('winner-tag') ? 0.8 : 0.4;
    let opacity = scale * baseOpacity; 
    if (opacity > 1) opacity = 1; if (opacity < 0.1) opacity = 0.1;
    let blur = (1 - scale) * 2; if (blur < 0) blur = 0;

    tag.el.style.transform = `translate3d(${screenX}px, ${screenY}px, 0) translate(-50%, -50%) scale(${scale})`;
    tag.el.style.opacity = opacity; tag.el.style.zIndex = Math.floor(scale * 1000); tag.el.style.filter = `blur(${blur}px)`;
    
    if (isSpinning && !tag.el.classList.contains('winner-tag')) {
      tag.el.style.color = '#00d2ff'; tag.el.style.textShadow = '0 0 15px #00d2ff';
    } else if (!tag.el.classList.contains('winner-tag')) {
      tag.el.style.color = '#fff'; tag.el.style.textShadow = '0 0 5px rgba(0,0,0,0.5)';
    }
  });
  animFrame = requestAnimationFrame(animateSphere);
}

// --- 控制逻辑 ---
function startSpin() {
  if (isSpinning || remainingKIDS.length === 0) return;
  isSpinning = true; targetSpeedX = 0.15; targetSpeedY = 0.3;
  document.getElementById('resultBoard').style.display = 'none';
}

function stopSpin() {
  if (!isSpinning) return;
  isSpinning = false; targetSpeedX = 0.002; targetSpeedY = 0.005;
  const minTier = Math.min(...remainingKIDS.map(k => k.tierIndex));
  const lowestTierKIDS = remainingKIDS.filter(k => k.tierIndex === minTier);
  const actualDrawCount = Math.min(drawCount, lowestTierKIDS.length);
  const shuffledTier = [...lowestTierKIDS].sort(() => 0.5 - Math.random());
  const winners = shuffledTier.slice(0, actualDrawCount);
  
  winners.forEach(w => {
    const tag = tags.find(t => t.name === w.name);
    tag.el.classList.add('winner-tag'); tag.el.style.color = '#ffd700'; tag.el.style.textShadow = '0 0 15px #ffd700, 0 0 30px #ff8c00';
  });

  setTimeout(() => {
    const board = document.getElementById('resultBoard');
    document.getElementById('resultGift').textContent = `获得：${winners[0].prizeName}`;
    const container = document.getElementById('winnerNamesContainer'); container.innerHTML = '';
    winners.forEach(w => {
      const nameSpan = document.createElement('div'); nameSpan.className = 'winner-name'; nameSpan.textContent = w.name; container.appendChild(nameSpan);
      const idx = remainingKIDS.findIndex(k => k.name === w.name); if (idx !== -1) remainingKIDS.splice(idx, 1);
    });
    board.style.display = 'block';
    setTimeout(() => { board.style.display = 'none'; }, 3000); // 电脑端看3秒自动消失
  }, 800);
}

// 星空背景 (简易版)
const canvas = document.getElementById('stars'), ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let stars = Array.from({length: 100}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2}));
function drawStars() { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='rgba(255,255,255,0.6)'; stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill(); s.y-=0.5; if(s.y<0)s.y=canvas.height;}); requestAnimationFrame(drawStars); } drawStars();
</script>
</body>
</html>
